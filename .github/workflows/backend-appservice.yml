name: Deploy Backend To Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - backend.Tests/**
      - .github/workflows/backend-appservice.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: 10.0.x
  BACKEND_PROJECT: backend/backend.csproj
  TEST_PROJECT: backend.Tests/backend.Tests.csproj
  PUBLISH_DIR: ./publish/backend

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore tests and backend dependencies
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build backend and tests
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build

      - name: Publish backend
        run: dotnet publish ${{ env.BACKEND_PROJECT }} --configuration Release --no-restore --output ${{ env.PUBLISH_DIR }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
